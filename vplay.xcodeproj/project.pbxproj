			name = "Generate FFmpeg dSYMs";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The prebuilt FFmpeg dylibs ship without dSYMs, which makes App Store Connect\n# report \"Upload Symbols Failed\" for every one of them. Generate a dSYM per dylib\n# (same UUIDs as the embedded copy) so the archive always contains them.\nif [ \"${DEBUG_INFORMATION_FORMAT}\" != \"dwarf-with-dsym\" ]; then\n  exit 0\nfi\nmkdir -p \"${DWARF_DSYM_FOLDER_PATH}\"\nfor lib in \"${FFMPEG_ROOT}\"/lib/*.dylib; do\n  name=$(basename \"$lib\")\n  rm -rf \"${DWARF_DSYM_FOLDER_PATH}/${name}.dSYM\"\n  /usr/bin/dsymutil \"$lib\" -o \"${DWARF_DSYM_FOLDER_PATH}/${name}.dSYM\" 2>/dev/null || exit 1\ndone\n";
		};
